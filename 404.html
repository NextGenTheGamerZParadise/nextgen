<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Over — NEXTGEN</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:#050509;color:#fff;font-family:system-ui,sans-serif}
    h1{font-size:clamp(64px,16vw,140px);font-weight:900;line-height:1;background:linear-gradient(90deg,#00eaff,#9d00ff,#ffcf00);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#aaa;margin:14px 0 28px}
    a{display:inline-block;padding:14px 24px;border-radius:10px;font-weight:800;text-decoration:none;color:#fff;background:linear-gradient(90deg,#00d9ff,#7c00ff)}
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>GAME OVER — this page doesn't exist.</p>
    <a id="home" href="./">BACK TO NEXTGEN</a>
  </div>
  <script>
    // Works for both username.github.io/ and username.github.io/repo-name/ project sites
    const seg = location.pathname.split('/').filter(Boolean);
    const isProjectSite = location.hostname.endsWith('github.io') && seg.length > 0;
    document.getElementById('home').href = isProjectSite ? '/' + seg[0] + '/' : '/';
  </script>
</body>
</html>
